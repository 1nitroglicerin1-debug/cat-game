<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat Suika Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #FDFBF7;
            background-image: url('./assets/bg.jpg'); /* Глобальный фон */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            color: #4A3F35;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* Адаптация под вертикальные экраны (телефоны) */
        @media (orientation: portrait) {
            body {
                background-image: url('./assets/bg-mobile.jpg');
            }
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
            justify-content: center;
        }

        #top-panel {
            width: 360px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            z-index: 10;
            gap: 10px;
        }

        .solid-panel {
            background: rgba(255, 250, 240, 0.85); /* Полупрозрачный теплый картон */
            border: 3px solid #C48A5E; /* Цвет крафтовой коробки */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #5D4037; /* Темно-коричневый текст под маркер */
        }

        .score-box {
            padding: 10px 15px;
            font-size: 22px;
            font-weight: 800;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #score-val {
            color: #D35400; /* Насыщенный карамельный/оранжевый */
        }

        .btn-restart-small {
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #D35400;
            transition: all 0.2s;
            padding: 0;
            flex-shrink: 0;
        }
        
        .btn-restart-small:active {
            transform: scale(0.9);
        }
        
        .btn-restart-small:hover {
            background: rgba(196, 138, 94, 0.15);
        }

        .next-box-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
        }

        .next-label {
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .next-img-wrapper {
            background: rgba(255, 255, 255, 0.6);
            border: 2px dashed #C48A5E; /* Пунктирная граница в стиле штампа */
            width: 65px;
            height: 65px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            /* Убрано overflow: hidden, чтобы увеличенный котик красиво вылезал за края */
        }
        
        #next-item-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scale(1.75); /* Масштаб, утвержденный пользователем */
            pointer-events: none; 
        }

        #game-container {
            position: relative;
            width: 320px; 
            height: 700px;
            box-sizing: content-box;
            
            /* Стены из крафтового картона */
            border: 22px solid #C48A5E;
            border-top: none;
            border-radius: 0 0 182px 182px; 
            
            /* Эффект матового стекла (очень легкий кремовый оттенок) */
            background-color: rgba(255, 245, 230, 0.15);
            
            /* Эффект размытия только ЗА колбой */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Внутренняя тень для объема выреза и легкая внешняя тень */
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4),
                        0 15px 35px rgba(0, 0, 0, 0.15);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0 0 160px 160px;
            background-color: transparent;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 238, 223, 0.85); /* Легкий оттенок бумаги */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #5D4037;
            border-radius: inherit;
        }
        
        #game-over-screen h1 {
            color: #D35400;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px #FFF;
        }

        .btn-restart {
            margin-top: 20px;
            padding: 15px 35px;
            font-size: 20px;
            background-color: #C48A5E; /* Под цвет коробки */
            color: #ffffff;
            border: 3px solid #8C6239; /* Темные рамки */
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.1s;
            font-weight: 800;
            box-shadow: 0 6px 0 #8C6239, 0 10px 15px rgba(0,0,0,0.1); /* Объемная кнопка */
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-restart:active {
            transform: translateY(4px); /* Кнопка вдавливается вниз */
            box-shadow: 0 2px 0 #8C6239, 0 4px 5px rgba(0,0,0,0.1);
        }

        .merge-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.2);
            pointer-events: none;
            z-index: 15;
            animation: glowPop 0.4s ease-out forwards;
        }

        .merge-star {
            position: absolute;
            font-size: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 16;
            animation: starFly 0.5s ease-out forwards;
        }

        @keyframes glowPop {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        @keyframes starFly {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.2) rotate(180deg); opacity: 0; }
        }

        #warning-screen {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .warning-text {
            color: #FF4500;
            font-size: 80px;
            font-weight: bold;
            text-shadow: 0 4px 15px rgba(255, 255, 255, 0.9), 0 0 10px rgba(255, 69, 0, 0.6);
            animation: warningPulse 1s infinite;
            line-height: 1;
        }

        @keyframes warningPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div id="top-panel">
            <div class="solid-panel score-box" id="score-box">
                Score: <span id="score-val">0</span>
            </div>
            
            <button class="solid-panel btn-restart-small" onclick="location.reload()" title="Restart">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            </button>
            
            <div class="solid-panel next-box-container">
                <div class="next-label">Next</div>
                <div class="next-img-wrapper">
                    <img id="next-item-img" src="" alt="Next Cat">
                </div>
            </div>
        </div>

        <div id="game-container">
            <div id="canvas-wrapper" style="width: 100%; height: 100%; position: relative;"></div>

            <div id="warning-screen">
                <div class="warning-text" id="warning-timer">3</div>
            </div>

            <div id="game-over-screen">
                <h1 class="text-4xl font-bold mb-4">Game Over!</h1>
                <p class="text-xl mb-8">Final Score: <span id="final-score" class="font-bold">0</span></p>
                <button class="btn-restart" onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const GAME_WIDTH = 320; 
        const GAME_HEIGHT = 700; 
        
        const CAT_LEVELS = [
            { level: 0, imgSrc: 'assets/cat1.png', radius: 22, color: '#FFC0CB', points: 1, img: null, renderScale: 1.22 },
            { level: 1, imgSrc: 'assets/cat2.png', radius: 26, color: '#FFD700', points: 3, img: null, renderScale: 1.22 },
            { level: 2, imgSrc: 'assets/cat3.png', radius: 30, color: '#FFA07A', points: 6, img: null, renderScale: 1.22 },
            { level: 3, imgSrc: 'assets/cat4.png', radius: 36, color: '#98FB98', points: 10, img: null, renderScale: 1.22 },
            { level: 4, imgSrc: 'assets/cat5.png', radius: 43, color: '#20B2AA', points: 15, img: null, renderScale: 1.25 },
            { level: 5, imgSrc: 'assets/cat6.png', radius: 51, color: '#87CEFA', points: 21, img: null, renderScale: 1.15 }, 
            { level: 6, imgSrc: 'assets/cat7.png', radius: 60, color: '#9370DB', points: 28, img: null, renderScale: 1.05 }, 
            { level: 7, imgSrc: 'assets/cat8.png', radius: 70, color: '#DDA0DD', points: 36, img: null, renderScale: 1.05 }, 
            { level: 8, imgSrc: 'assets/cat9.png?v=new3', radius: 82, color: '#F08080', points: 45, img: null, renderScale: 1.16 }, 
            { level: 9, imgSrc: 'assets/cat10.png', radius: 90, color: '#FF69B4', points: 55, img: null, renderScale: 1.17 }, 
            { level: 10, imgSrc: 'assets/cat11.png', radius: 100, color: '#FF4500', points: 66, img: null, renderScale: 1.04 } 
        ];

        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Events = Matter.Events;

        let engine;
        let render;
        let runner;
        
        let currentScore = 0;
        let isGameOver = false;
        let nextCatLevel = 0;
        let activeDropper = null;
        let canDrop = true;
        let dropCooldown = 800; 
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const audioBuffers = {};
        
        const audioPaths = {
            drop: './assets/drop.mp3',
            merge: './assets/merge.mp3',
            gameover: './assets/gameover.mp3',
            victory: './assets/victory.mp3'
        };

        // Асинхронная предзагрузка всех аудиофайлов в память
        async function preloadAudio() {
            for (const [name, path] of Object.entries(audioPaths)) {
                try {
                    const response = await fetch(path);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    audioBuffers[name] = audioBuffer;
                } catch (error) {
                    console.error(`[Audio Error] Ошибка загрузки звука ${name} по пути ${path}:`, error);
                }
            }
        }

        // Разблокировка Autoplay политики браузера при первом тапе/клике
        function unlockAudio() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => {
                    console.log("[Audio] Контекст успешно разблокирован!");
                }).catch(err => {
                    console.error("[Audio] Ошибка при попытке разблокировать контекст:", err);
                });
            }
            // Снимаем слушатели после успешной попытки
            document.removeEventListener('pointerdown', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('mousedown', unlockAudio);
        }

        document.addEventListener('pointerdown', unlockAudio, { passive: true });
        document.addEventListener('touchstart', unlockAudio, { passive: true });
        document.addEventListener('mousedown', unlockAudio, { passive: true });

        // Мгновенное воспроизведение без задержек
        function playSound(name, volumeMultiplier = 1.0) {
            if (!audioCtx || !audioBuffers[name]) return;
            
            try {
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffers[name];
                
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = volumeMultiplier;
                
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                source.start(0);
            } catch (err) {
                console.error(`[Audio Play Error] Ошибка при проигрывании ${name}:`, err);
            }
        }

        const spawnY = 80; 
        const gameOverLineY = 210; 
        
        let warningStartTime = 0;
        let isWarningActive = false;
        let lastInputX = GAME_WIDTH / 2;
        let mergeAnimations = [];

        function preloadImages(callback) {
            let loadedCount = 0;
            const totalImages = CAT_LEVELS.length;
            
            CAT_LEVELS.forEach(cat => {
                const img = new Image();
                img.onload = () => {
                    cat.img = img;
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        callback();
                    }
                };
                img.onerror = () => {
                    loadedCount++;
                    if (loadedCount === totalImages) callback();
                };
                img.src = cat.imgSrc;
            });
        }

        function resizeApp() {
            const wrapper = document.getElementById('app-wrapper');
            const availableHeight = window.innerHeight;
            const availableWidth = window.innerWidth;
            
            const scale = Math.min(1, availableHeight / 1000, availableWidth / 450);
            wrapper.style.transform = `scale(${scale})`;
        }

        function init() {
            engine = Engine.create();
            engine.world.gravity.y = 1.0; 
            
            // Улучшение стабильности физики (Solver Iterations)
            engine.positionIterations = 10; 
            engine.velocityIterations = 8;
            engine.constraintIterations = 6;

            render = Render.create({
                element: document.getElementById('canvas-wrapper'),
                engine: engine,
                options: {
                    width: GAME_WIDTH,
                    height: GAME_HEIGHT,
                    wireframes: false, 
                    background: 'transparent',
                    pixelRatio: window.devicePixelRatio
                }
            });

            const bowlRadius = GAME_WIDTH / 2;
            const bowlCenterY = GAME_HEIGHT - bowlRadius; 
            const bowlParts = [];
            const numParts = 35; 
            
            const partThickness = 200; 
            const physicsBowlRadius = bowlRadius + (partThickness / 2); 
            
            for (let i = 0; i < numParts; i++) {
                const angle = Math.PI - (i + 0.5) * (Math.PI / numParts);
                const x = GAME_WIDTH / 2 + physicsBowlRadius * Math.cos(angle);
                const y = bowlCenterY + physicsBowlRadius * Math.sin(angle);
                const partLength = (Math.PI * physicsBowlRadius) / numParts;

                const part = Bodies.rectangle(x, y, partLength * 1.5, partThickness, {
                    isStatic: true,
                    angle: angle + Math.PI / 2,
                    render: { visible: false }, 
                    friction: 1.0,       // Максимальное трение для пола
                    frictionStatic: 1.0, // Чтобы коты крепко держались
                    restitution: 0 
                });
                bowlParts.push(part);
            }

            const wallThickness = 200; 
            const leftWall = Bodies.rectangle(-wallThickness/2, bowlCenterY / 2, wallThickness, GAME_HEIGHT * 2, { 
                isStatic: true, render: { visible: false }, friction: 1.0, frictionStatic: 1.0, restitution: 0 
            });
            const rightWall = Bodies.rectangle(GAME_WIDTH + wallThickness/2, bowlCenterY / 2, wallThickness, GAME_HEIGHT * 2, { 
                isStatic: true, render: { visible: false }, friction: 1.0, frictionStatic: 1.0, restitution: 0 
            });

            Composite.add(engine.world, [leftWall, rightWall, ...bowlParts]);

            Events.on(render, 'afterRender', customRender);

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            resizeApp();
            window.addEventListener('resize', resizeApp);

            setupInput();
            setupCollisions();
            setupGameLoop(); 

            rollNextCat();
            spawnDropper(); 
        }

        function setupInput() {
            const getXPos = (e) => {
                const canvasEl = render.canvas;
                if (!canvasEl) return lastInputX;
                const rect = canvasEl.getBoundingClientRect();
                
                let clientX;
                if (e.type.includes('touch')) {
                    if (e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX;
                    } else if (e.changedTouches && e.changedTouches.length > 0) {
                        clientX = e.changedTouches[0].clientX;
                    } else {
                        return lastInputX;
                    }
                } else {
                    clientX = e.clientX;
                }

                const scaleX = GAME_WIDTH / rect.width;
                return (clientX - rect.left) * scaleX;
            };

            const handleMove = (e) => {
                if (isGameOver) return;
                
                let xPos = getXPos(e);
                let currentRadius = activeDropper ? CAT_LEVELS[activeDropper.label].radius : CAT_LEVELS[nextCatLevel].radius;
                
                lastInputX = Math.max(currentRadius + 2, Math.min(xPos, GAME_WIDTH - currentRadius - 2));
                
                if (activeDropper && canDrop) {
                    Matter.Body.setPosition(activeDropper, { x: lastInputX, y: spawnY });
                }
            };

            const handleDrop = (e) => {
                if (isGameOver || !activeDropper || !canDrop) return;
                
                if (e.type !== 'touchend') {
                    handleMove(e);
                }
                
                canDrop = false;
                Matter.Body.setStatic(activeDropper, false);
                activeDropper.isSensor = false;
                
                playSound('drop', 1.0); 
                
                activeDropper.createdAt = Date.now();
                activeDropper = null;
                
                setTimeout(() => {
                    if (!isGameOver) {
                        spawnDropper();
                        canDrop = true;
                    }
                }, dropCooldown);
            };

            document.addEventListener('mousemove', handleMove);
            document.addEventListener('mouseup', handleDrop);
            
            document.addEventListener('touchstart', handleMove, { passive: false });
            document.addEventListener('touchmove', handleMove, { passive: false });
            document.addEventListener('touchend', handleDrop);
        }

        function rollNextCat() {
            const rand = Math.random();
            if (rand < 0.4) nextCatLevel = 0;      
            else if (rand < 0.7) nextCatLevel = 1; 
            else if (rand < 0.9) nextCatLevel = 2; 
            else if (rand < 0.97) nextCatLevel = 3;
            else nextCatLevel = 4;                 

            const imgEl = document.getElementById('next-item-img');
            imgEl.src = CAT_LEVELS[nextCatLevel].imgSrc;
        }

        function spawnDropper() {
            const data = CAT_LEVELS[nextCatLevel];
            let spawnX = Math.max(data.radius + 2, Math.min(lastInputX, GAME_WIDTH - data.radius - 2));
            activeDropper = createCatBody(spawnX, spawnY, nextCatLevel, true);
            Composite.add(engine.world, activeDropper);
            rollNextCat();
        }

        function createCatBody(x, y, levelIndex, isStatic = false) {
            const data = CAT_LEVELS[levelIndex];
            
            const body = Bodies.circle(x, y, data.radius, {
                isStatic: isStatic,
                isSensor: isStatic, 
                label: levelIndex.toString(),
                restitution: 0.1, 
                friction: 0.8,         // Повышенное трение, чтобы не скользили
                frictionStatic: 1.0,   // Статическое трение
                linearDamping: 0.1,    // Гашение инерции движения
                angularDamping: 0.2,   // Гашение бесконечного вращения
                slop: 0.05,          
                render: { visible: false }
            });
            
            body.createdAt = Date.now(); 
            body.hasCollided = false; 
            
            return body;
        }

        function setupCollisions() {
            Events.on(engine, 'collisionStart', function(event) {
                if (isGameOver) return;
                
                const pairs = event.pairs;
                const bodiesToRemove = [];

                for (let i = 0; i < pairs.length; i++) {
                    const bodyA = pairs[i].bodyA;
                    const bodyB = pairs[i].bodyB;

                    if (bodyA.isStatic || bodyB.isStatic) continue;
                    
                    if (bodyA.label === bodyB.label && !isNaN(parseInt(bodyA.label))) {
                        const level = parseInt(bodyA.label);
                        
                        if (bodiesToRemove.includes(bodyA) || bodiesToRemove.includes(bodyB)) continue;

                        if (level < CAT_LEVELS.length - 1) {
                            const newLevel = level + 1;
                            const midX = (bodyA.position.x + bodyB.position.x) / 2;
                            const midY = (bodyA.position.y + bodyB.position.y) / 2;

                            bodiesToRemove.push(bodyA, bodyB);
                            
                            // Звук победы для максимального уровня
                            if (newLevel === CAT_LEVELS.length - 1) {
                                playSound('victory', 1.0); 
                            } else {
                                playSound('merge', 1.0); 
                            }
                            
                            mergeAnimations.push({
                                level: level,
                                newLevel: newLevel,
                                points: CAT_LEVELS[newLevel].points,
                                x1: bodyA.position.x, y1: bodyA.position.y, angle1: bodyA.angle,
                                x2: bodyB.position.x, y2: bodyB.position.y, angle2: bodyB.angle,
                                midX: midX, midY: midY,
                                startTime: Date.now(),
                                duration: 150 
                            });
                        }
                    }
                }

                if (bodiesToRemove.length > 0) {
                    Composite.remove(engine.world, bodiesToRemove);
                }
            });
        }

        function updateScore(points) {
            currentScore += points;
            const scoreEl = document.getElementById('score-val');
            const scoreBox = document.getElementById('score-box');
            
            scoreEl.innerText = currentScore;
            scoreBox.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                scoreBox.style.transform = 'scale(1)';
            }, 150);
        }

        function setupGameLoop() {
            Events.on(engine, 'beforeUpdate', function() {
                if (isGameOver) return;

                const now = Date.now();
                
                for (let i = mergeAnimations.length - 1; i >= 0; i--) {
                    const anim = mergeAnimations[i];
                    if (now - anim.startTime >= anim.duration) {
                        const newCat = createCatBody(anim.midX, anim.midY, anim.newLevel);
                        newCat.isMergeResult = true; 
                        newCat.createdAt = now;
                        
                        Composite.add(engine.world, newCat);
                        updateScore(anim.points);
                        createMergeExplosion(anim.midX, anim.midY);
                        
                        mergeAnimations.splice(i, 1);
                    }
                }

                const bodies = Composite.allBodies(engine.world);
                let anyBodyOverLine = false;

                for (let i = 0; i < bodies.length; i++) {
                    const body = bodies[i];

                    if (body.isStatic || isNaN(parseInt(body.label))) continue;
                    
                    const radius = CAT_LEVELS[parseInt(body.label)].radius;
                    
                    if ((body.position.y - radius * 0.2) < gameOverLineY && (body.speed < 0.5)) {
                        if (Date.now() - body.createdAt > 1500) {
                            anyBodyOverLine = true;
                            break; 
                        }
                    }
                }

                if (anyBodyOverLine) {
                    if (!isWarningActive) {
                        isWarningActive = true;
                        warningStartTime = Date.now();
                        document.getElementById('warning-screen').style.display = 'flex';
                        document.getElementById('warning-timer').innerText = '3';
                    } else {
                        const timeElapsed = Date.now() - warningStartTime;
                        const timeLeft = Math.ceil((3000 - timeElapsed) / 1000);
                        
                        if (timeLeft <= 0) {
                            triggerGameOver();
                        } else {
                            document.getElementById('warning-timer').innerText = timeLeft;
                        }
                    }
                } else {
                    if (isWarningActive) {
                        isWarningActive = false;
                        document.getElementById('warning-screen').style.display = 'none';
                    }
                }
            });
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('warning-screen').style.display = 'none';
            Matter.Runner.stop(runner);
            
            playSound('gameover', 1.0); 
            
            document.getElementById('final-score').innerText = currentScore;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function customRender() {
            const ctx = render.context;
            const now = Date.now();
            
            // Отрисовка линии проигрыша в виде маркера
            ctx.beginPath();
            ctx.moveTo(0, gameOverLineY);
            ctx.lineTo(GAME_WIDTH, gameOverLineY);
            ctx.strokeStyle = '#3E2723'; 
            ctx.lineWidth = 4; 
            ctx.lineCap = 'round'; 
            ctx.setLineDash([15, 12]); 
            ctx.stroke();
            ctx.setLineDash([]); 
            ctx.lineCap = 'butt'; 

            const bodies = Composite.allBodies(engine.world);
            for (let body of bodies) {
                if (body.label >= 0 && body.label <= 10) {
                    const data = CAT_LEVELS[body.label];
                    
                    if (data.img && data.img.complete && data.img.height > 0) {
                        ctx.save();
                        
                        ctx.translate(body.position.x, body.position.y);
                        ctx.rotate(body.isStatic ? 0 : body.angle);
                        
                        let popScale = 1;
                        if (body.isMergeResult) {
                            const age = now - body.createdAt;
                            const growTime = 150;
                            const shrinkTime = 300; 
                            
                            if (age < growTime) {
                                popScale = (age / growTime) * 1.2;
                            } else if (age < shrinkTime) {
                                popScale = 1.2 - ((age - growTime) / growTime) * 0.2;
                            } else {
                                body.isMergeResult = false; 
                            }
                        }
                        
                        const aspectRatio = data.img.width / data.img.height;
                        const renderScale = data.renderScale; 
                        
                        const drawHeight = data.radius * 2 * renderScale * popScale;
                        const drawWidth = drawHeight * aspectRatio;
                        
                        ctx.drawImage(data.img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                        
                        ctx.restore();
                    }
                }
            }

            for (let anim of mergeAnimations) {
                const data = CAT_LEVELS[anim.level];
                if (!data.img || !data.img.complete) continue;

                let t = (now - anim.startTime) / anim.duration;
                if (t > 1) t = 1;

                const drawMergeHalf = (startX, startY, startAngle) => {
                    const currX = startX + (anim.midX - startX) * t;
                    const currY = startY + (anim.midY - startY) * t;
                    
                    ctx.save();
                    ctx.translate(currX, currY);
                    ctx.rotate(startAngle); 
                    
                    const shrinkScale = 1 - (0.4 * t); 
                    
                    const aspectRatio = data.img.width / data.img.height;
                    const renderScale = data.renderScale; 
                    
                    const drawHeight = data.radius * 2 * renderScale * shrinkScale;
                    const drawWidth = drawHeight * aspectRatio;
                    
                    ctx.globalAlpha = 1 - (0.3 * t); 
                    ctx.drawImage(data.img, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
                    
                    ctx.restore();
                };

                drawMergeHalf(anim.x1, anim.y1, anim.angle1);
                drawMergeHalf(anim.x2, anim.y2, anim.angle2);
            }
        }

        function createMergeExplosion(x, y) {
            const canvasWrapper = document.getElementById('canvas-wrapper');
            const canvas = render.canvas;
            const rect = canvas.getBoundingClientRect();
            
            const scaleX = rect.width / GAME_WIDTH;
            const scaleY = rect.height / GAME_HEIGHT;
            
            const screenX = x * scaleX;
            const screenY = y * scaleY;
            
            const glow = document.createElement('div');
            glow.className = 'merge-glow';
            glow.style.left = `${screenX}px`;
            glow.style.top = `${screenY}px`;
            canvasWrapper.appendChild(glow);
            
            for(let i = 0; i < 4; i++) {
                const star = document.createElement('div');
                star.className = 'merge-star';
                star.innerText = '✨';
                star.style.left = `${screenX}px`;
                star.style.top = `${screenY}px`;
                
                const angle = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 40;
                star.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
                
                canvasWrapper.appendChild(star);
                
                setTimeout(() => {
                    if(canvasWrapper.contains(star)) canvasWrapper.removeChild(star);
                }, 500);
            }
            
            setTimeout(() => {
                if(canvasWrapper.contains(glow)) canvasWrapper.removeChild(glow);
            }, 400); 
        }

        // Дожидаемся загрузки аудио перед инициализацией игры
        window.onload = async () => {
            await preloadAudio();
            preloadImages(() => {
                init();
            });
        };
    </script>
